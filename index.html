<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A00">
<meta name="robots" content="noindex">
<title>ระบบผลการเรียนออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --o:#1e70b8; --o-btn:#1e70b8; --o-d:#1e70b8; --o-l:#FFF1E4; --o-m:#b2dbff52; --sun:#FFC21A;
  --ink:#1B2133; --ink2:#5B6275; --line:#E6E8F0; --bg:#F5F6FA; --card:#fff;
  --ok:#0E8A45; --ok-bg:#E3F6EB; --warn:#9A5A00; --warn-bg:#FFF2D2; --bad:#D92D3A; --bad-bg:#FDE8EA;
  --f-head:"Prompt","Sarabun","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}

/* progress bar */
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:transparent;overflow:hidden}
#bar.on::after{content:"";position:absolute;inset:0;width:40%;background:var(--o);animation:bar 1s infinite ease-in-out}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;gap:12px}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(4px + var(--st));background:var(--o)}
.top{padding-top:calc(14px + var(--st))}
.logo{width:42px;height:42px;border-radius:12px;background:var(--o);color:#fff;display:grid;place-items:center;font:700 20px var(--f-head);flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{min-width:0;flex:1}
.brand b{display:block;font:600 16px/1.2 var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--ink2);font-size:13px}
.ic{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.ic:hover{background:var(--bg)}
.ic svg{width:22px;height:22px}

/* layout */
.main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.main.wide{max-width:960px}
.main.has-nav{padding-bottom:calc(96px + var(--sb))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.sm{font-size:14px}
.h-title{font-size:22px;font-weight:600;margin:4px 0 2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:2px solid transparent;border-radius:14px;font:600 18px var(--f-head);background:var(--o-btn);color:#fff;transition:transform .06s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--o-d)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:#fff;color:var(--o-d);border-color:var(--o-m)}
.btn.ghost:hover{background:var(--o-l)}
.btn.danger{background:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.btn svg{width:20px;height:20px}

/* forms */
label.f{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
.inp,.sel{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-size:17px}
.inp:focus,.sel:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 4px var(--o-m)}
.inp[disabled]{background:var(--bg);color:var(--ink2)}
.fld+.fld{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--o)}
.hint{font-size:13px;color:var(--ink2);margin-top:6px}

/* login */
.hero{background:var(--o);color:#fff;padding:calc(32px + var(--st)) 20px 84px;text-align:center}
.hero .logo{width:76px;height:76px;border-radius:22px;margin:0 auto 14px;background:#fff;color:var(--o);font-size:34px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.hero h1{font-size:26px}
.hero p{margin:6px 0 0;opacity:.95}
.login-card{max-width:440px;margin:-56px auto 24px;padding:18px;box-shadow:0 10px 30px rgba(27,33,51,.12)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;min-height:44px;border-radius:11px;font:600 16px var(--f-head);color:var(--ink2)}
.seg button.on{background:#fff;color:var(--o-d);box-shadow:0 1px 4px rgba(27,33,51,.15)}
.nid{font:600 24px var(--f-head);letter-spacing:.06em;text-align:center;height:60px}
.err{color:var(--bad);font-weight:600;font-size:15px;min-height:22px;margin:10px 0 0}

/* student */
.me{background:var(--o);color:#fff;border-radius:22px;padding:18px}
.me h2{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.22);font-size:14px;font-weight:600}
.chip.sel{border:1.5px solid var(--o-m);background:#fff;color:var(--o-d);min-height:40px;font-size:15px;cursor:pointer}
.chip.sel.on{background:var(--o-btn);border-color:var(--o-btn);color:#fff}
.terms{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.gpa{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gpa .n{font:700 48px/1 var(--f-head);color:var(--o-d)}
.sub{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sub:first-child{border-top:0}
.sub .nm{font-weight:600}
.tile{flex:none;min-width:56px;height:48px;border-radius:14px;display:grid;place-items:center;font:700 22px var(--f-head);background:var(--warn-bg);color:var(--warn)}
.tile.g{background:var(--ok-bg);color:var(--ok)}
.tile.b{background:var(--bad-bg);color:var(--bad)}
.tile.n{background:var(--bg);color:var(--ink2)}

/* level cards */
.lv{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;transition:border-color .15s,transform .06s}
.lv:hover{border-color:var(--o)}
.lv:active{transform:scale(.99)}
.lv h3{font-size:26px}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.meter{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:12px 0 6px}
.meter i{display:block;height:100%;background:var(--o);border-radius:99px}
.meter.full i{background:var(--ok)}

/* list rows (admin) */
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--o-l);color:var(--o-d);display:grid;place-items:center;font:600 15px var(--f-head);flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.o{background:var(--o-l);color:var(--o-d)}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font:600 19px var(--f-head);margin-bottom:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sel{flex:1;min-width:140px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--sb))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border-radius:14px;color:var(--ink2);font:600 12px var(--f-head)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--o-d);background:var(--o-l)}

/* grade grid page */
.gp{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.gtop{background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + var(--st)) 8px 8px;display:flex;align-items:center;gap:6px;position:relative}
.gtop::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(4px + var(--st));background:var(--o)}
.gtop{padding-top:calc(12px + var(--st))}
.gtop h2{font-size:20px}
.gwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
body.kp-open .gwrap{padding-bottom:230px}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fff;padding:0;text-align:center}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--o-l);padding:8px 4px;min-width:76px;font:600 13px/1.25 var(--f-head);vertical-align:bottom}
.grid thead th .sn{display:block;color:var(--ink)}
.grid thead th .sc{display:block;color:var(--o-d);font-weight:500;font-size:12px;margin-top:2px}
.grid .c-name{position:sticky;left:0;z-index:2;min-width:150px;max-width:170px;text-align:left;padding:0 8px;background:#fff}
.grid thead .c-name{z-index:4;background:var(--o-l)}
.grid .c-name .no{display:inline-block;width:22px;color:var(--ink2);font-size:13px}
.grid .c-name .nm{font-size:15px;font-weight:600}
.grid .c-gpa{position:sticky;right:0;z-index:2;min-width:64px;font:700 16px var(--f-head);color:var(--o-d);background:#FFF8F2}
.grid thead .c-gpa{z-index:4;background:var(--o-l)}
.grid tr:nth-child(even) td{background:#FCFCFE}
.grid tr:nth-child(even) td.c-name{background:#FCFCFE}
.gc{width:100%;min-width:76px;height:46px;border:0;background:transparent;text-align:center;font:600 19px var(--f-head);border-radius:0}
.gc:focus{outline:none;background:var(--o-m);box-shadow:inset 0 0 0 3px var(--o)}
.gc.v0{background:var(--bad-bg);color:var(--bad)}
.gc.v0:focus{background:var(--o-m)}
.gc.miss{background:var(--sun)}
.gv{height:46px;font:600 19px var(--f-head)}
.gv.v0{color:var(--bad);background:var(--bad-bg)!important}
.gfoot{background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--sb));display:flex;align-items:center;gap:10px}
.gfoot .st{flex:1;min-width:0;font-size:14px;line-height:1.3}
.gfoot .st b{display:block;font:600 15px var(--f-head)}
.gfoot .st .s-ok{color:var(--ok)} .gfoot .st .s-err{color:var(--bad)} .gfoot .st .s-wait{color:var(--warn)}
.banner{background:var(--ok-bg);color:var(--ok);font-weight:600;font-size:14px;padding:8px 14px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* keypad */
#kp{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:2px solid var(--o);padding:8px 10px calc(10px + var(--sb));box-shadow:0 -8px 24px rgba(27,33,51,.14)}
#kp .kl{font-size:14px;font-weight:600;color:var(--ink2);padding:0 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kp .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#kp button{height:52px;border:1.5px solid var(--o-m);background:var(--o-l);border-radius:14px;font:700 22px var(--f-head);color:var(--ink)}
#kp button:active{background:var(--o-m)}
#kp .del{color:var(--bad);font-size:17px}
#kp .next{grid-column:span 2;background:var(--o-btn);border-color:var(--o-btn);color:#fff;font-size:18px}
#kp .done{font-size:17px;background:#fff}

/* modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(27,33,51,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.wide{max-width:760px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 8px 20px}
.sh-h h2{font-size:21px}
.sh-b{padding:8px 20px 12px;overflow:auto;flex:1}
.sh-f{display:flex;gap:10px;padding:12px 20px calc(14px + var(--sb));border-top:1px solid var(--line)}
.sh-f .btn{flex:1}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.tt{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s ease-out}
.tt.ok{background:var(--ok)} .tt.err{background:var(--bad)}

/* import preview */
.imp{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.imp h3{font-size:19px}
.crow{display:grid;grid-template-columns:1fr 78px 64px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.crow .inp{height:40px;padding:0 8px;text-align:center;font-size:16px;border-radius:10px}
.crow .chk{min-height:36px;justify-content:center}
.warnl{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:14pt}
  #app,#toast,#ov,#kp,#bar{display:none!important}
  #print{display:block}
}
.rp{font-family:"Sarabun","TH Sarabun New",sans-serif;color:#000}
.rp-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px}
.rp-head img{width:70px;height:70px;object-fit:contain}
.rp-head .s{font:700 20pt/1.2 "Sarabun",sans-serif}
.rp-head .t{font-size:16pt;font-weight:700}
.rp-info{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:13pt}
.rp-info td{padding:2px 6px}
.rp-t{width:100%;border-collapse:collapse;font-size:13pt}
.rp-t th,.rp-t td{border:1px solid #000;padding:5px 8px}
.rp-t th{background:#eee}
.rp-t td.c,.rp-t th.c{text-align:center}
.rp-t tfoot td{font-weight:700}
.rp-note{font-size:11pt;margin-top:6px}
.rp-sign{display:flex;justify-content:space-around;margin-top:46px;text-align:center;font-size:13pt}
.rp-sign div{width:42%}
.rp-sign .ln{border-bottom:1px dotted #000;height:34px;margin-bottom:6px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"></div>
<div id="print"></div>
<div id="toast" aria-live="polite"></div>
<div id="kp" hidden>
  <div class="kl" id="kpl"></div>
  <div class="kg">
    <button data-v="0">0</button><button data-v="1">1</button><button data-v="1.5">1.5</button><button data-v="2">2</button>
    <button data-v="2.5">2.5</button><button data-v="3">3</button><button data-v="3.5">3.5</button><button data-v="4">4</button>
    <button data-v="" class="del">ลบ</button><button class="next" data-next="1">ถัดไป</button><button class="done" data-done="1">เสร็จ</button>
  </div>
</div>

<script>
/* ============================================================
 * ตั้งค่า: วาง Web App URL ที่ได้จากการ Deploy Apps Script (ลงท้ายด้วย /exec)
 * ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbzB1_oz02b43iXZMkqG6rbnQE-6d5h6hVa6eNA7B1l6AeezMxCS3VDnGNjWT2qaRUP_BQ/exec";

/* ---------- ตัวช่วย ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COARSE = matchMedia('(pointer:coarse)').matches;
const GRADES = [0, 1, 1.5, 2, 2.5, 3, 3.5, 4];
const isGrade = v => v !== '' && v != null && GRADES.includes(Number(v));
const num = n => (n == null || n === '' ? '' : String(Number(n)));
const gpaStr = g => (g == null ? '–' : Number(g).toFixed(2));
const roundGpa = x => Math.round(x * 100) / 100;     // ต้องตรงกับ roundGpa_ ใน Code.gs
const when = iso => { try { return new Date(iso).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } };
const shortPrefix = p => ({ 'เด็กชาย': 'ด.ช.', 'เด็กหญิง': 'ด.ญ.' }[p] || p || '');
const stuName = s => (s.prefix || '') + s.first + ' ' + s.last;
const gradeClass = g => g == null ? 'n' : g >= 3 ? 'g' : g <= 0.99 ? 'b' : '';
const calcGpa = (subs, get) => {
  let pts = 0, cr = 0;
  subs.forEach(s => { if (!s.count_gpa) return; const g = get(s); if (g === '' || g == null) return; pts += g * s.credit; cr += s.credit; });
  return cr ? roundGpa(pts / cr) : null;
};
function nidOk(s) {   // ตรวจเลขหลักสุดท้ายของบัตรประชาชนไทย
  if (!/^\d{13}$/.test(s)) return false;
  let t = 0; for (let i = 0; i < 12; i++) t += +s[i] * (13 - i);
  return (11 - t % 11) % 10 === +s[12];
}

const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4zM13 7l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',

/* ---------- สถานะ + เรียก API ---------- */
const S = { token: sessionStorage.getItem('tk') || '', role: '', name: '', levels: [], cfg: { school_name: 'ระบบผลการเรียน', logo_url: '', term: '' }, allLevels: [] };
const app = $('#app');
let busy = 0;
const setBusy = d => { busy += d; $('#bar').classList.toggle('on', busy > 0); };

async function api(action, data = {}) {
  if (API_URL.includes('PASTE')) throw new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html');
  setBusy(1);
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: S.token, ...data }), signal: ctl.signal
    });
    const j = await res.json();
    if (!j.ok) {
      const e = new Error(j.error || 'เกิดข้อผิดพลาด'); e.code = j.code;
      if (j.code === 'AUTH' && S.token) expireSession();
      throw e;
    }
    return j.data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('เชื่อมต่อช้าเกินไป กรุณาลองใหม่');
    if (e instanceof SyntaxError) throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง ตรวจว่า Deploy เป็น Web app และ "Who has access" = Anyone');
    if (e instanceof TypeError) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    throw e;
  } finally { clearTimeout(to); setBusy(-1); }
}

function expireSession() {
  sessionStorage.removeItem('tk'); S.token = ''; G = null; closeModal(); hideKp();
  renderLogin(); toast('หมดเวลาเข้าใช้งาน กรุณาเข้าสู่ระบบใหม่', 'err');
}
function logout() {
  if (G && G.dirty.size && !confirm('มีเกรดที่ยังไม่ได้บันทึก ออกจากระบบเลยหรือไม่?')) return;
  api('logout').catch(() => {});
  sessionStorage.removeItem('tk'); S.token = ''; S.role = ''; G = null; hideKp(); renderLogin();
}

/* ---------- Toast / Modal ---------- */
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'tt ' + type; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), 3200);
}
function closeModal() { const o = $('#ov'); if (o) o.remove(); }
/** actions: [{label, cls, fn}] — fn คืน false เพื่อไม่ปิดหน้าต่าง */
function modal({ title, body, actions = [], wide = false }) {
  closeModal();
  const ov = document.createElement('div'); ov.id = 'ov'; ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sh-h"><h2>${esc(title)}</h2><button class="ic" data-x aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sh-b">${body}</div><div class="sh-f"></div></div>`;
  document.body.appendChild(ov);
  const f = $('.sh-f', ov);
  actions.forEach(a => {
    const b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = async () => {
      b.disabled = true;
      try { const r = await a.fn?.(); if (r !== false) closeModal(); }
      catch (e) { toast(e.message, 'err'); }
      finally { b.disabled = false; }
    };
    f.appendChild(b);
  });
  if (!actions.length) f.remove();
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  $('[data-x]', ov).onclick = closeModal;
  const first = $('input:not([disabled]),select', ov); if (first && !COARSE) first.focus();
  return ov;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const confirmBox = (msg, ok = 'ยืนยัน', danger = false, title = 'ยืนยันการทำรายการ') => new Promise(res => {
  let done = false;
  const m = modal({ title, body: `<p style="margin:4px 0 8px">${esc(msg)}</p>`, actions: [
    { label: 'ยกเลิก', cls: 'ghost', fn: () => { done = true; res(false); } },
    { label: ok, cls: danger ? 'danger' : '', fn: () => { done = true; res(true); } }] });
  $('[data-x]', m).addEventListener('click', () => { if (!done) res(false); });
  m.addEventListener('mousedown', e => { if (e.target === m && !done) res(false); });
});

      go.disabled = d.length !== 13; err.textContent = '';

function bindGrid() {
  const wrap = $('.gwrap'); if (!wrap || G.locked) return;
  wrap.addEventListener('focusin', e => { if (e.target.classList.contains('gc')) { G.cur = e.target; e.target.select(); if (COARSE) showKp(e.target); } });
  wrap.addEventListener('focusout', e => {
    if (!e.target.classList.contains('gc')) return;
    commit(e.target);
    setTimeout(() => { const a = document.activeElement; if (!a || (!a.classList?.contains('gc') && !a.closest?.('#kp'))) hideKp(); }, 60);
  });
  wrap.addEventListener('input', e => {
    const el = e.target; if (!el.classList.contains('gc')) return;
    let v = el.value.replace(/,/g, '.').replace(/[^0-9.]/g, '');
    if ({ '15': '1.5', '25': '2.5', '35': '3.5' }[v]) v = { '15': '1.5', '25': '2.5', '35': '3.5' }[v];   // พิมพ์ลัด: 15 → 1.5
    el.value = v;
    if (['0', '4', '1.5', '2.5', '3.5'].includes(v)) { commit(el); moveNext(el); }
  });
  wrap.addEventListener('keydown', e => {
    const el = e.target; if (!el.classList.contains('gc')) return;
    const r = +el.dataset.r, c = +el.dataset.c;
    const go = (dr, dc) => { e.preventDefault(); commit(el); focusCell(r + dr, c + dc); };
    if (e.key === 'Enter') go(e.shiftKey ? -1 : 1, 0);
    else if (e.key === 'ArrowDown') go(1, 0); else if (e.key === 'ArrowUp') go(-1, 0);
    else if (e.key === 'ArrowRight') go(0, 1); else if (e.key === 'ArrowLeft') go(0, -1);
  });
  wrap.addEventListener('paste', e => {
    const el = e.target; if (!el.classList.contains('gc')) return;
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (!/[\t\n]/.test(text.trim())) return;   // ข้อความเดี่ยวให้พิมพ์ตามปกติ
    e.preventDefault();
    const r0 = +el.dataset.r, c0 = +el.dataset.c; let bad = 0, n = 0;
    text.replace(/\r/g, '').split('\n').filter((l, i, a) => l !== '' || i < a.length - 1).forEach((line, i) => {
      line.split('\t').forEach((cell, j) => {
        const t = G.cells[r0 + i]?.[c0 + j]; if (!t) return;
        const v = cell.trim().replace(',', '.');
        if (v === '' ) return;
        if (isGrade(v)) { t.value = num(v); commit(t); n++; } else bad++;
      });
    });
    toast(bad ? `วางแล้ว ${n} ช่อง ข้าม ${bad} ช่องที่ไม่ใช่เกรด` : `วางแล้ว ${n} ช่อง`, bad ? '' : 'ok');
  });
}

function focusCell(r, c) {
  const rows = G.cells.length, cols = G.d.subjects.length;
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  const el = G.cells[r]?.[c]; if (!el) return;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: 'center', inline: 'center', behavior: COARSE ? 'auto' : 'smooth' });
}
function moveNext(el) {
  const r = +el.dataset.r, c = +el.dataset.c, cols = G.d.subjects.length;
  if (c + 1 < cols) focusCell(r, c + 1); else if (r + 1 < G.cells.length) focusCell(r + 1, 0); else { el.blur(); hideKp(); }
}

/** ยืนยันค่าที่พิมพ์ในช่อง → อัปเดตข้อมูล, GPA, ความคืบหน้า, ตั้งเวลาบันทึกอัตโนมัติ */
function commit(el) {
  if (!G || G.locked || !el.isConnected) return;
  const sid = G.d.students[+el.dataset.r].student_id, bid = G.d.subjects[+el.dataset.c].id, key = gk(sid, bid);
  const raw = el.value.trim(), prev = G.vals.get(key);
  let v;
  if (raw === '') v = '';
  else if (isGrade(raw)) v = Number(raw);
  else {
    el.value = prev == null ? '' : num(prev); el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 300);
    toast('ใช้ได้เฉพาะ 0, 1, 1.5, 2, 2.5, 3, 3.5, 4', 'err'); return;
  }
  el.value = v === '' ? '' : num(v);
  const same = (v === '' && prev == null) || v === prev;
  el.classList.toggle('v0', v === 0); if (v !== '') el.classList.remove('miss');
  if (same) return;
  if (v === '') G.vals.delete(key); else G.vals.set(key, v);
  G.dirty.set(key, v);
  updGpa(sid); updProg(); setState('มีการแก้ไข…', 'wait');
  clearTimeout(G.timer); G.timer = setTimeout(() => flush(false), 3500);
}
function updGpa(sid) {
  const cell = document.getElementById('gpa-' + sid); if (!cell || !G) return;
  const g = calcGpa(G.d.subjects, b => G.vals.get(gk(sid, b.id)));
  cell.textContent = g == null ? '–' : g.toFixed(2);
}
function filledCount() { let n = 0; G.d.students.forEach(s => G.d.subjects.forEach(b => { if (G.vals.has(gk(s.student_id, b.id))) n++; })); return n; }
function updProg() { const t = G.d.students.length * G.d.subjects.length; const p = $('#gProg'); if (p) p.textContent = `กรอกแล้ว ${filledCount()}/${t} ช่อง`; }
function setState(msg, cls = '') { const s = $('#gState'); if (s) { s.textContent = msg; s.className = cls ? 's-' + cls : ''; } }

async function flush(manual) {
  if (!G || G.locked) return true;
  clearTimeout(G.timer);
  if (G.saving) {   // กำลังบันทึกอยู่ ให้รอรอบนั้นจบก่อน
    G.again = true;
    while (G && G.saving) await new Promise(r => setTimeout(r, 100));
    return G ? G.dirty.size === 0 : true;
  }
  if (!G.dirty.size) { if (manual) toast('บันทึกแล้ว', 'ok'); setState('บันทึกแล้ว', 'ok'); return true; }
  G.saving = true; setState('กำลังบันทึก…', 'wait');
  const snap = [...G.dirty];
  try {
    await api('saveGrades', { level: G.level, changes: snap.map(([k, v]) => { const i = k.indexOf('|'); return [k.slice(0, i), k.slice(i + 1), v]; }) });
    snap.forEach(([k, v]) => { if (G && G.dirty.get(k) === v) G.dirty.delete(k); });
    setState('บันทึกแล้ว', 'ok'); if (manual) toast('บันทึกแล้ว', 'ok');
  } catch (e) {
    if (G) { G.saving = false; setState('บันทึกไม่สำเร็จ — ' + e.message, 'err'); }
    if (manual) toast(e.message, 'err'); return false;
  }
  G.saving = false;
  if (G.again || G.dirty.size) { G.again = false; return flush(manual); }
  return true;
}
window.addEventListener('beforeunload', e => { if (G && G.dirty.size) { e.preventDefault(); e.returnValue = ''; } });

async function leaveGrid() {

async function approveGrid() {
  const { students: st, subjects: sb } = G.d;
  const missing = [];
  st.forEach((s, r) => sb.forEach((b, c) => { if (!G.vals.has(gk(s.student_id, b.id))) missing.push(G.cells[r][c]); }));
  if (missing.length) {
    missing.forEach(el => el.classList.add('miss'));
    focusCell(+missing[0].dataset.r, +missing[0].dataset.c);
    return toast(`ยังกรอกไม่ครบ เหลืออีก ${missing.length} ช่อง (ช่องสีเหลือง)`, 'err');
  }
  if (!(await flush(true))) return;
  if (!(await confirmBox(`อนุมัติเกรด ${G.level} (${st.length} คน)? หลังอนุมัติจะแก้ไขไม่ได้ และนักเรียนจะเห็นผลการเรียนทันที`, 'อนุมัติเกรด', false, 'อนุมัติเกรดรายชั้น'))) return;
  try { await api('approve', { level: G.level }); toast('อนุมัติเกรดแล้ว', 'ok'); hideKp(); openGrid(G.level); }

}

/* ----- นำเข้าจาก Excel ----- */
async function loadXLSX() {
  if (window.XLSX) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้ ตรวจสอบอินเทอร์เน็ต')); document.head.appendChild(s);
  });
}
function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: 'array' }), out = [];
  wb.SheetNames.forEach(name => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    const hi = rows.findIndex(r => r.some(c => String(c).includes('เลขประจำตัวประชาชน')));
    if (hi < 0) return;
    const H = rows[hi].map(c => String(c).trim()), col = t => H.findIndex(h => h.includes(t));
    const cNo = col('เลขที่'), cSid = col('เลขประจำตัวนักเรียน'), cNid = col('เลขประจำตัวประชาชน'), cName = col('ชื่อ');
    if (cSid < 0 || cNid < 0 || cName < 0) return;
    const subj = []; for (let j = cName + 3; j < H.length; j++) if (H[j] && !/เฉลี่ย|GPA/i.test(H[j])) subj.push({ j, name: H[j] });
    const o = { level: name.trim(), students: [], subjects: subj.map(s => s.name), grades: [], warnings: [] };
    rows.slice(hi + 1).forEach((r, i) => {
      let prefix = String(r[cName]).trim(), first = String(r[cName + 1]).trim(), last = String(r[cName + 2]).trim();
      const sid = String(r[cSid]).trim(), nid = String(r[cNid]).replace(/\D/g, '');
      if (!sid && !nid && !first && !prefix) return;
      if (!first && prefix) { const m = prefix.match(/^(เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.|นางสาว|นาง|นาย)?\s*(\S+)\s+(.+)$/); if (m) { prefix = m[1] || ''; first = m[2]; last = m[3]; } }
      const no = cNo >= 0 ? Number(r[cNo]) || '' : o.students.length + 1;
      if (nid && !nidOk(nid)) o.warnings.push(`เลขที่ ${no || i + 1}: เลขบัตรประชาชนไม่ผ่านการตรวจเลขหลักสุดท้าย (อาจพิมพ์ผิด)`);
      o.students.push({ no, student_id: sid, nid, prefix, first, last });
      subj.forEach(s => {
        const v = r[s.j]; if (v === '' || v == null) return;
        const n = Number(String(v).replace(',', '.'));
        if (isGrade(n)) o.grades.push([sid, s.name, n]); else o.warnings.push(`เลขที่ ${no || i + 1} วิชา ${s.name}: เกรด "${v}" ไม่ถูกต้อง (ข้ามช่องนี้)`);
      });
    });
    if (o.students.length) out.push(o);
  });
  return out;
}

      const existing = {};

      box.innerHTML = sheets.map((s, i) => `<div class="imp"><h3>${esc(s.level)}</h3>
        <div class="muted sm">นักเรียน ${s.students.length} คน • ${s.subjects.length} วิชา • เกรดในไฟล์ ${s.grades.length} ช่อง</div>
        ${s.warnings.length ? `<div class="warnl">${s.warnings.slice(0, 6).map(esc).join('<br>')}${s.warnings.length > 6 ? `<br>…และอีก ${s.warnings.length - 6} รายการ` : ''}</div>` : ''}
        <label class="chk"><input type="checkbox" id="gr_${i}" ${s.grades.length ? 'checked' : ''} ${s.grades.length ? '' : 'disabled'}> นำเข้าเกรดจากไฟล์เป็นฉบับร่าง (ยังไม่อนุมัติ)</label>
        <div class="row" style="margin:6px 0"><span class="sm grow"><b>หน่วยกิต</b> ตั้งให้ทุกวิชา</span><input class="inp" id="all_${i}" type="number" step="0.5" min="0.5" value="1" style="width:78px;height:40px;text-align:center"><button class="btn ghost sm" data-all="${i}">ใช้</button></div>
        <div class="crow muted sm" style="border-top:0"><span>รายวิชา</span><span style="text-align:center">หน่วยกิต</span><span style="text-align:center">นับ GPA</span></div>
        ${s.subjects.map((n, k) => { const ex = existing[s.level + '|' + n]; return `<div class="crow"><span>${esc(n)}</span><input class="inp" id="cr_${i}_${k}" type="number" step="0.5" min="0.5" value="${ex ? ex.credit : 1}"><label class="chk"><input type="checkbox" id="cg_${i}_${k}" ${ex ? (ex.count_gpa ? 'checked' : '') : 'checked'}></label></div>`; }).join('')}</div>`).join('');
      $$('[data-all]', box).forEach(b => b.onclick = () => { const i = b.dataset.all; $$(`[id^="cr_${i}_"]`, box).forEach(x => x.value = $(`#all_${i}`).value); });
    } catch (err) { box.innerHTML = `<div class="warnl">${esc(err.message)}</div>`; }
  };
}
function showImportResult(results) {
  modal({
    title: 'นำเข้าเสร็จแล้ว', actions: [{ label: 'ตกลง' }],
    body: results.map(([lv, r]) => `<div class="imp" style="margin-top:8px"><h3>${esc(lv)}</h3>
      <div class="sm">เพิ่มใหม่ ${r.added} คน • อัปเดต ${r.updated} คน • เกรด ${r.grades} ช่อง</div>
      ${r.grades_skipped ? `<div class="warnl">ข้ามการนำเข้าเกรด ${r.grades_skipped} ช่อง เพราะชั้นนี้อนุมัติแล้ว</div>` : ''}
      ${r.skipped.length ? `<div class="warnl"><b>ข้าม ${r.skipped.length} รายการ</b><br>${r.skipped.slice(0, 8).map(esc).join('<br>')}</div>` : ''}</div>`).join('')
  });
}

/* ----- วิชา ----- */
async function renderSubjects() {
  staffShell(spin, 'subjects', true); await ensureLevels();
  let list = [];
  if (ADM.level) { try { list = await api('listSubjects', { level: ADM.level }); } catch (e) { toast(e.message, 'err'); } }
  const rows = list.map(s => `<div class="li"><div class="av">${esc(s.order)}</div><div class="grow"><b>${esc(s.name)}</b>${s.count_gpa ? '' : '<span class="tag">ไม่นับ GPA</span>'}</div>
    <span class="tag o">${num(s.credit)} หน่วยกิต</span><button class="ic" data-e="${esc(s.id)}" aria-label="แก้ไข">${ICON.edit}</button><button class="ic" data-d="${esc(s.id)}" aria-label="ลบ">${ICON.trash}</button></div>`).join('');
  staffShell(`<h1 class="h-title">วิชาและหน่วยกิต</h1>
    <div class="toolbar">${S.allLevels.length ? levelSel() : ''}<button class="btn sm" id="bAdd" ${S.allLevels.length ? '' : 'disabled'}>${ICON.plus}เพิ่มวิชา</button><button class="btn ghost sm" id="bCopy" ${S.allLevels.length > 1 ? '' : 'disabled'}>คัดลอกจากชั้นอื่น</button></div>
    <div class="card">${rows || `<div class="empty"><b>${ADM.level ? 'ยังไม่มีรายวิชาในชั้นนี้' : 'ยังไม่มีระดับชั้น'}</b>${ADM.level ? 'กด “เพิ่มวิชา” หรือคัดลอกจากชั้นอื่น' : 'เพิ่มระดับชั้นที่แท็บ “ตั้งค่า” หรือนำเข้านักเรียนจาก Excel'}</div>`}</div>`, 'subjects', true);
  if ($('#lvSel')) $('#lvSel').onchange = e => { ADM.level = e.target.value; renderSubjects(); };
  $('#bAdd').onclick = () => subjectForm(null);
  $('#bCopy').onclick = () => {
    const others = S.allLevels.filter(l => l !== ADM.level);
    modal({ title: `คัดลอกวิชามาที่ ${ADM.level}`, body: `<label class="f">คัดลอกจากชั้น</label><select class="sel" id="cpf">${others.map(l => `<option>${esc(l)}</option>`).join('')}</select><p class="hint">คัดลอกเฉพาะวิชาที่ยังไม่มีชื่อซ้ำในชั้นนี้ พร้อมหน่วยกิต</p>`,
      actions: [{ label: 'ยกเลิก', cls: 'ghost' }, { label: 'คัดลอก', fn: async () => { const r = await api('copySubjects', { from: $('#cpf').value, to: ADM.level }); toast(`คัดลอก ${r.copied} วิชา`, 'ok'); renderSubjects(); } }] });
  };
  $$('[data-e]').forEach(b => b.onclick = () => subjectForm(list.find(s => s.id === b.dataset.e)));
  $$('[data-d]').forEach(b => b.onclick = async () => {
    const s = list.find(x => x.id === b.dataset.d);
    if (await confirmBox(`ลบวิชา ${s.name}? (เกรดเดิมที่เคยบันทึกยังเก็บไว้)`, 'ลบ', true)) {
      try { await api('deleteSubject', { id: s.id }); toast('ลบแล้ว', 'ok'); renderSubjects(); } catch (e) { toast(e.message, 'err'); }
    }
  });
}
function subjectForm(s) {
  modal({
    title: s ? 'แก้ไขวิชา' : 'เพิ่มวิชา',
    body: `<div class="fld"><label class="f">ชื่อวิชา</label><input class="inp" id="fName" value="${esc(s?.name || '')}"></div>
      <div class="two fld"><div><label class="f">หน่วยกิต</label><input class="inp" id="fCr" type="number" inputmode="decimal" step="0.5" min="0.5" value="${s ? num(s.credit) : 1}"></div>
        <div><label class="f">ลำดับในตาราง</label><input class="inp" id="fOrd" type="number" inputmode="numeric" value="${s ? esc(s.order) : ''}" placeholder="ต่อท้าย"></div></div>
      <label class="chk"><input type="checkbox" id="fGpa" ${s && !s.count_gpa ? '' : 'checked'}> นับรวมในเกรดเฉลี่ย (GPA)</label>
      ${s ? '<div class="hint">หากเปลี่ยนหน่วยกิตหลังอนุมัติเกรดไปแล้ว GPA ของนักเรียนจะถูกคำนวณใหม่ด้วยค่าที่แก้</div>' : ''}`,
    actions: [{ label: 'ยกเลิก', cls: 'ghost' }, {
      label: 'บันทึก', fn: async () => {
        await api('saveSubject', { id: s?.id, level: ADM.level, name: $('#fName').value, credit: $('#fCr').value, order: $('#fOrd').value, count_gpa: $('#fGpa').checked });
        toast('บันทึกแล้ว', 'ok'); renderSubjects();
      }
    }]
  });
}

/* ----- ผู้ใช้ ----- */
async function renderUsers() {
  staffShell(spin, 'users', true); await ensureLevels();
  let list = [];
  try { list = await api('listUsers'); } catch (e) { toast(e.message, 'err'); }
  const rows = list.map(u => `<div class="li" ${u.active ? '' : 'style="opacity:.55"'}><div class="av">${esc(u.name.charAt(0))}</div>
    <div class="grow"><b>${esc(u.name)}</b>${u.active ? '' : '<span class="tag">ปิดใช้งาน</span>'}<div class="muted sm">${esc(u.username)} • ${u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ครู: ' + (u.levels.length ? esc(u.levels.join(', ')) : 'ยังไม่กำหนดชั้น')}</div></div>
    <button class="ic" data-e="${esc(u.username)}" aria-label="แก้ไข">${ICON.edit}</button></div>`).join('');
  staffShell(`<h1 class="h-title">ผู้ใช้งาน</h1><div class="toolbar"><button class="btn sm" id="bAdd">${ICON.plus}เพิ่มผู้ใช้</button></div><div class="card">${rows}</div>`, 'users', true);
  $('#bAdd').onclick = () => userForm(null);
  $$('[data-e]').forEach(b => b.onclick = () => userForm(list.find(u => u.username === b.dataset.e)));
}
function userForm(u) {
  const isNew = !u;
  const m = modal({
    title: isNew ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้',
    body: `<div class="fld"><label class="f">ชื่อ-สกุล</label><input class="inp" id="uName" value="${esc(u?.name || '')}"></div>
      <div class="two fld"><div><label class="f">ชื่อผู้ใช้</label><input class="inp" id="uUn" autocapitalize="none" value="${esc(u?.username || '')}" ${isNew ? '' : 'disabled'}></div>
        <div><label class="f">สิทธิ์</label><select class="sel" id="uRole"><option value="teacher" ${u?.role === 'admin' ? '' : 'selected'}>ครู</option><option value="admin" ${u?.role === 'admin' ? 'selected' : ''}>ผู้ดูแลระบบ</option></select></div></div>
      <div class="fld"><label class="f">รหัสผ่าน</label><input class="inp" id="uPw" type="password" autocomplete="new-password" placeholder="${isNew ? 'อย่างน้อย 6 ตัวอักษร' : 'เว้นว่างถ้าไม่เปลี่ยน'}"></div>
      <div class="fld" id="uLvBox"><label class="f">ชั้นที่รับผิดชอบ</label>${S.allLevels.length ? S.allLevels.map(l => `<label class="chk"><input type="checkbox" name="uLv" value="${esc(l)}" ${u?.levels.includes(l) || u?.levels.includes('*') ? 'checked' : ''}> ${esc(l)}</label>`).join('') : '<div class="hint">ยังไม่มีระดับชั้น</div>'}</div>
      <label class="chk"><input type="checkbox" id="uAct" ${u && !u.active ? '' : 'checked'}> เปิดใช้งานบัญชีนี้</label>`,
    actions: [...(isNew ? [] : [{ label: 'ลบผู้ใช้', cls: 'danger', fn: async () => {
        if (!(await confirmBox(`ลบผู้ใช้ ${u.name}?`, 'ลบ', true))) return false;
        await api('deleteUser', { username: u.username }); toast('ลบแล้ว', 'ok'); renderUsers();
      } }]), { label: 'ยกเลิก', cls: 'ghost' }, {
      label: 'บันทึก', fn: async () => {
        await api('saveUser', { username: isNew ? $('#uUn').value : u.username, name: $('#uName').value, role: $('#uRole').value, password: $('#uPw').value, active: $('#uAct').checked, levels: $$('[name=uLv]:checked').map(x => x.value) });
        toast('บันทึกแล้ว', 'ok'); renderUsers();
      }
    }]
  });
  const sync = () => { $('#uLvBox', m).hidden = $('#uRole', m).value === 'admin'; };
  $('#uRole', m).onchange = sync; sync();
}

/* ----- ตั้งค่า ----- */
async function renderSettings() {
  staffShell(spin, 'settings', true); await ensureLevels();
  let c; try { c = await api('getSettings'); } catch (e) { return toast(e.message, 'err'); }
  let logoData = '', removeLogo = false;
  staffShell(`<h1 class="h-title">ตั้งค่าโรงเรียน</h1>
    <div class="card stack">
      <div class="fld"><label class="f">ชื่อโรงเรียน</label><input class="inp" id="sName" value="${esc(c.school_name)}"></div>
      <div class="two fld"><div><label class="f">ปีการศึกษา (ภาคเรียน)</label><input class="inp" id="sTerm" value="${esc(c.term)}" placeholder="2569"></div>
        <div><label class="f">ชื่อผู้อำนวยการ (พิมพ์ในใบรายงาน)</label><input class="inp" id="sDir" value="${esc(c.director_name)}"></div></div>
      <div class="hint">เมื่อเปลี่ยนปีการศึกษา ครูจะเริ่มกรอกเกรดชุดใหม่ ส่วนเกรดเดิมที่อนุมัติแล้วนักเรียนยังดูย้อนหลังได้</div>
      <div class="fld"><label class="f">โลโก้โรงเรียน</label>
        <div class="row"><span class="logo" id="lgPrev" style="width:64px;height:64px;border-radius:16px">${c.logo_url ? `<img src="${esc(c.logo_url)}" alt="" referrerpolicy="no-referrer">` : esc(c.school_name.charAt(0))}</span>
          <label class="btn ghost sm" style="cursor:pointer">${ICON.up}เลือกรูป<input type="file" id="lgFile" accept="image/png,image/jpeg,image/webp" hidden></label>
          <button class="btn ghost sm" id="lgDel" ${c.logo_url ? '' : 'disabled'}>ลบโลโก้</button></div></div>
      <button class="btn block" id="sSave">บันทึกการตั้งค่า</button></div>
    <div class="card stack" style="margin-top:14px"><h3>ระดับชั้น</h3>
      <div class="chips" style="margin:0">${S.allLevels.map(l => `<span class="chip sel on" style="cursor:default">${esc(l)}</span>`).join('') || '<span class="muted sm">ยังไม่มี</span>'}</div>
      <div class="row"><input class="inp" id="lvNew" placeholder="เช่น ม.2" maxlength="20"><button class="btn ghost" id="lvAdd">เพิ่ม</button></div></div>`, 'settings', true);
  $('#lgFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 256 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      logoData = cv.toDataURL('image/png'); removeLogo = false; URL.revokeObjectURL(url);
      $('#lgPrev').innerHTML = `<img src="${logoData}" alt="">`; $('#lgDel').disabled = false;
    };
    img.onerror = () => toast('อ่านไฟล์รูปไม่ได้', 'err'); img.src = url;
  };
  $('#lgDel').onclick = () => { logoData = ''; removeLogo = true; $('#lgPrev').textContent = $('#sName').value.charAt(0); $('#lgDel').disabled = true; };
  $('#sSave').onclick = async e => {
    e.target.disabled = true;
    try {
      const r = await api('saveSettings', { school_name: $('#sName').value, term: $('#sTerm').value, director_name: $('#sDir').value, logo_data: logoData, remove_logo: removeLogo });
      S.cfg = { ...S.cfg, school_name: r.school_name, term: r.term, logo_url: r.logo_url }; toast('บันทึกแล้ว', 'ok'); renderSettings();
    } catch (err) { toast(err.message, 'err'); e.target.disabled = false; }
  };
  $('#lvAdd').onclick = async () => {
    try { S.allLevels = await api('addLevel', { level: $('#lvNew').value }); toast('เพิ่มระดับชั้นแล้ว', 'ok'); renderSettings(); } catch (e) { toast(e.message, 'err'); }
  };
}

/* ============================== เริ่มต้น ============================== */
(async function init() {
  try { S.cfg = { ...S.cfg, ...(await api('ping')) }; } catch (e) { /* ใช้ค่าเริ่มต้นไว้ก่อน */ }
  document.title = S.cfg.school_name + ' — ผลการเรียนออนไลน์';
  if (S.token) {
    try {
      const r = await api('me'); S.role = r.role; S.name = r.name; S.levels = r.levels || [];
      if (r.role === 'student') return renderStudent();
      return enterStaff();
    } catch (e) { sessionStorage.removeItem('tk'); S.token = ''; }
  }
  renderLogin();
})();
</script>
